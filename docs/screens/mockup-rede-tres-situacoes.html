<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Rede — três situações</title>
<style>
  :root{--navy:#123B6E;--navy3:#1B4C86;--page:#F4F6F8;--border:#E1E5EA;--title:#1B3E6F;--label:#6B7683;--fieldbg:#D6E8FF;--fieldtx:#1B4C86;--ok:#2E7D32;--okbg:#E5F6E6;--amber:#8A5A00;--amberbg:#FFF4D6}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Segoe UI",system-ui,Arial,sans-serif;background:#E8ECF0;color:#1a1a1a}
  .shot{width:1280px;height:800px;background:var(--page);display:flex;position:relative;overflow:hidden}
  .sb{width:220px;background:var(--navy);color:#fff;padding:16px 12px;display:flex;flex-direction:column}
  .brand{font-weight:700;font-size:15px;padding:4px 8px 18px}
  .ni{height:40px;border-radius:8px;display:flex;align-items:center;padding:0 12px;font-weight:650;color:#E8F0FA;margin-bottom:4px}
  .ni.on{background:var(--navy3)}
  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .top{height:64px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 22px}
  .toptitle{font-size:20px;font-weight:700;color:var(--title)}
  .topsub{font-size:12px;color:var(--label);margin-top:2px}
  .body{padding:18px 22px;display:flex;gap:14px}
  .card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:16px;width:340px}
  .card.new{outline:3px solid #2E9B4A}
  .k{font-size:11px;font-weight:700;letter-spacing:.4px;color:var(--label)}
  .cn{font-size:16px;font-weight:700;color:var(--title);margin-top:6px}
  .cm{font-size:12px;color:var(--label);margin-top:4px}
  .chip{display:inline-flex;margin-top:10px;height:24px;align-items:center;padding:0 8px;border-radius:999px;font-size:11px;font-weight:700}
  .run{background:#EAF3FF;color:#1B4C86}
  .newc{background:var(--okbg);color:var(--ok)}
  .bar{height:8px;background:#EEF0F3;border-radius:99px;margin-top:14px;overflow:hidden}
  .bar b{display:block;height:100%;background:#3BAA48;width:33%}
  .mask{position:absolute;inset:0;background:rgba(18,59,110,.45);display:flex;align-items:center;justify-content:center}
  .dlg{width:720px;background:#fff;border-radius:14px;box-shadow:0 18px 48px rgba(18,59,110,.22)}
  .hd{padding:16px 18px 12px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between}
  .dt{font-size:18px;font-weight:700;color:var(--title)}
  .ds{font-size:12.5px;color:var(--label);margin-top:3px;line-height:1.4}
  .x{width:32px;height:32px;border:1px solid var(--border);border-radius:8px;display:flex;align-items:center;justify-content:center}
  .bd{padding:14px 18px;display:flex;flex-direction:column;gap:12px}
  .fl{font-size:11px;font-weight:700;color:var(--label);letter-spacing:.3px}
  .fi{height:38px;margin-top:5px;border:1px solid var(--border);border-radius:8px;background:#F7FAFD;display:flex;align-items:center;padding:0 12px;font-weight:650;color:var(--title)}
  .grid{display:grid;grid-template-columns:1.3fr .7fr .8fr;gap:10px}
  .seg{display:flex;background:#EEF3F8;border-radius:9px;padding:3px;gap:3px;margin-top:5px}
  .seg b{flex:1;height:36px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--label);font-size:13px}
  .seg .on{background:var(--navy);color:#fff}
  .file{border:1.5px dashed #B7C8DC;border-radius:10px;background:#F7FAFD;padding:12px 14px;display:flex;align-items:center;gap:12px}
  .fn{font-weight:700;color:var(--title);font-size:13px}
  .fm{font-size:12px;color:var(--label);margin-top:2px}
  .pick{margin-left:auto;height:30px;padding:0 10px;border-radius:7px;border:1px solid var(--navy);color:var(--navy);font-size:12px;font-weight:700;display:flex;align-items:center}
  .note{background:#F4F8FC;border:1px solid #C5D4E6;border-radius:10px;padding:12px 14px;font-size:13px;color:var(--title);line-height:1.45}
  .note b{display:block;margin-bottom:2px}
  .ft{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px 16px;border-top:1px solid var(--border)}
  .ghost,.pri{height:36px;padding:0 14px;border-radius:8px;font-weight:700;font-size:13px;display:flex;align-items:center}
  .ghost{border:1px solid var(--border);background:#fff;color:var(--title)}
  .pri{background:var(--navy);color:#fff}
  .banner{position:absolute;left:236px;right:16px;bottom:16px;background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px 14px;font-size:13px;color:var(--title);line-height:1.4}
  .banner b{color:var(--navy)}
</style>
</head>
<body>
  <div class="shot" id="s1"></div>
  <div class="shot" id="s2"></div>
  <div class="shot" id="s3"></div>
<script>
function shell(inner){
  return `<aside class="sb"><div class="brand">assetexperts</div><div class="ni on">Home</div><div class="ni">Importar / Exportar</div><div class="ni">Projetos</div><div class="ni">Cadastros</div></aside><section class="main"><header class="top"><div><div class="toptitle">Home</div><div class="topsub">Visão dos inventários em andamento</div></div></header><div class="body">
    <div class="card"><div class="k">SUBESTAÇÃO</div><div class="cn">Elétrica Jan 2027</div><div class="cm">Em andamento · 12 instalações</div><span class="chip run">4 de 12 revisadas</span><div class="bar"><b></b></div></div>
  </div></section>${inner}`;
}
function dlg(sub, body, button){
  return `<div class="mask"><div class="dlg"><div class="hd"><div><div class="dt">Novo projeto</div><div class="ds">${sub}</div></div><div class="x">✕</div></div><div class="bd">${body}</div><div class="ft"><div class="ghost">Cancelar</div><div class="pri">${button}</div></div></div></div>`;
}
const topo = `<div><div class="fl">NOME DO PROJETO</div><div class="fi">Distribuição de Energia — Jan/2027</div></div>
<div class="grid"><div><div class="fl">PERÍODO</div><div class="fi">Janeiro</div></div><div><div class="fl">ANO</div><div class="fi">2027</div></div><div><div class="fl">SETOR</div><div class="fi">Elétrico</div></div></div>
<div><div class="fl">CONCESSIONÁRIA</div><div class="fi">Distribuição de Energia</div></div>
<div><div class="fl">O QUE VAMOS INVENTARIAR</div><div class="seg"><b>Subestação</b><b class="on">Rede</b></div></div>`;
document.getElementById("s1").innerHTML = shell(dlg(
  "Situação 1. A rede já tem base. A planilha cria a campanha de rede.",
  topo + `<div><div class="fl">PLANILHA DA BASE</div><div class="file"><div><div class="fn">Base Rede Jan 2027.xlsx</div><div class="fm">PRJ-1042 · PRJ-1048 · PRJ-1101</div></div><div class="pick">Trocar</div></div></div>
  <div class="note"><b>Campanha nova, ao lado da de subestação.</b>Cada código de projeto vira uma instalação. Poste, trafo e chave entram como item. Coordenada da linha grava no item.</div>`,
  "Importar projeto"
));
document.getElementById("s2").innerHTML = shell(dlg(
  "Situação 2. Ainda não há base. A campanha de rede nasce vazia.",
  topo + `<div class="note"><b>Sem planilha.</b>No campo, a sobra pede o código do projeto, o equipamento e a coordenada daquele ponto. A primeira sobra daquele código cria o projeto.</div>`,
  "Criar campanha de rede"
));
document.getElementById("s3").innerHTML = `<aside class="sb"><div class="brand">assetexperts</div><div class="ni on">Home</div><div class="ni">Importar / Exportar</div><div class="ni">Projetos</div><div class="ni">Cadastros</div></aside>
<section class="main"><header class="top"><div><div class="toptitle">Home</div><div class="topsub">A campanha das subestações já estava em andamento</div></div></header>
<div class="body">
  <div class="card"><div class="k">SUBESTAÇÃO</div><div class="cn">Elétrica Jan 2027</div><div class="cm">Em andamento · 12 instalações</div><span class="chip run">4 de 12 revisadas</span><div class="bar"><b></b></div></div>
  <div class="card new"><div class="k">REDE · ACABOU DE CHEGAR</div><div class="cn">Rede Jan 2027</div><div class="cm">Pendente · 3 projetos</div><span class="chip newc">PRJ-1042 · PRJ-1048 · PRJ-1101</span></div>
</div></section>
<div class="banner"><b>Situação 3.</b> A base de rede chegou depois. Ela criou o card da direita. O card da esquerda, que já estava em campo, não muda. No celular, o botão Rede abre os três projetos.</div>`;
const q = new URLSearchParams(location.search).get("estado");
if (q) {
  document.body.style.margin = "0";
  ["s1","s2","s3"].forEach(id => { if (id !== "s"+q.slice(-1) && !(q==="1"&&id==="s1") && !(q==="2"&&id==="s2") && !(q==="3"&&id==="s3")) document.getElementById(id).style.display = "none"; });
  if (q==="1") { document.getElementById("s2").style.display="none"; document.getElementById("s3").style.display="none"; }
  if (q==="2") { document.getElementById("s1").style.display="none"; document.getElementById("s3").style.display="none"; }
  if (q==="3") { document.getElementById("s1").style.display="none"; document.getElementById("s2").style.display="none"; }
}
</script>
</body>
</html>
