<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Onde fica Incluir rede</title>
<style>
  :root{--navy:#123B6E;--navy3:#1B4C86;--page:#F1F3F5;--border:#E1E5EA;--title:#1B3E6F;--label:#6B7683;--fieldbg:#D6E8FF;--fieldtx:#1B4C86;--okbg:#DFF3E3;--oktx:#2E7D32;--green:#3BAA48}
  *{box-sizing:border-box;margin:0;padding:0}
  body{margin:0;background:#E8ECF0;font-family:"Segoe UI",system-ui,Arial,sans-serif}
  .app{width:1100px;height:520px;display:flex;background:var(--page);border:1px solid var(--border)}
  .sb{width:210px;background:var(--navy);color:#fff;padding:16px 12px}
  .brand{font-weight:700;padding:4px 8px 16px}
  .ni{height:38px;border-radius:8px;display:flex;align-items:center;padding:0 12px;font-weight:650;margin-bottom:4px}
  .ni.on{background:var(--navy3)}
  .main{flex:1;display:flex;flex-direction:column}
  .top{height:58px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 18px;font-size:20px;font-weight:700;color:var(--title)}
  .body{padding:16px 18px}
  .pt{font-size:15px;font-weight:700;color:var(--title);margin-bottom:10px}
  .cc{width:460px;background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px 16px 12px}
  .cch{display:flex;justify-content:space-between;gap:8px}
  .name{font-size:16px;font-weight:700;color:var(--title)}
  .meta{font-size:12px;color:var(--label);margin-top:3px}
  .chip{height:22px;padding:0 8px;border-radius:999px;background:var(--fieldbg);color:var(--fieldtx);font-size:11px;font-weight:700;display:inline-flex;align-items:center}
  .bar{height:6px;background:#E6EAEE;border-radius:3px;margin-top:12px}
  .bar i{display:block;height:100%;width:33%;background:var(--green);border-radius:3px}
  .foot{display:flex;justify-content:space-between;font-size:12px;color:var(--label);margin-top:6px}
  .foot b{color:var(--title)}
  .mini{display:flex;gap:16px;margin-top:10px;padding-top:10px;border-top:1px solid #EDF0F3}
  .mi{font-size:11px;color:var(--label)}
  .mi b{display:block;font-size:14px;color:var(--title)}
  .actions{display:flex;justify-content:flex-end;margin-top:12px}
  .btn{height:34px;padding:0 12px;border-radius:8px;background:var(--navy);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;outline:3px solid #2E9B4A;outline-offset:2px}
  .call{margin-top:8px;font-size:12px;font-weight:700;color:#2E7D32;text-align:right}
</style>
</head>
<body>
  <div class="app" id="app">
    <aside class="sb">
      <div class="brand">assetexperts</div>
      <div class="ni on">Home</div>
      <div class="ni">Importar / Exportar</div>
      <div class="ni">Projetos</div>
    </aside>
    <section class="main">
      <header class="top">Home</header>
      <div class="body">
        <div class="pt">Campanhas</div>
        <div class="cc">
          <div class="cch">
            <div>
              <div class="name">Elétrica Jan 2027</div>
              <div class="meta">Janeiro 2027 · Elétrica · 12 instalações</div>
            </div>
            <span class="chip">Em andamento</span>
          </div>
          <div class="bar"><i></i></div>
          <div class="foot"><span><b>4</b> de 12 revisadas</span><span>33%</span></div>
          <div class="mini">
            <div class="mi"><b>1</b>em campo</div>
            <div class="mi"><b>3</b>finalizadas</div>
            <div class="mi"><b>8</b>pendentes</div>
          </div>
          <div class="actions"><div class="btn">Incluir rede</div></div>
          <div class="call">↑ aqui. O resto do card abre as subestações.</div>
        </div>
      </div>
    </section>
  </div>
</body>
</html>
